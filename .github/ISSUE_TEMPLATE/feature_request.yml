name: ✨ 功能建议
description: 提出一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 这个建议针对的痛点是什么？
      placeholder: 我希望在 …… 时能够 ……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你设想 Reina 怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他考虑过的方案（可选）
