name: 🐛 Bug 反馈
description: 报告一个问题，帮助 Reina 变得更好
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的是什么？
      placeholder: 清楚描述这个 bug……
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 怎样能稳定重现？
      placeholder: |
        1. 打开 ……
        2. 点击 ……
        3. 看到 ……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Reina 版本
      placeholder: 例如 0.1.13
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图（可选）
      description: 相关日志或截图。请先去除任何密钥等敏感信息。
